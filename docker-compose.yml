services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: litellm-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - ./data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    ports:
      - "4000:4000"
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "false"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # The official LiteLLM image is built on Chainguard Wolfi and ships NO
      # curl/wget — only python3 (it's a Python app). Using curl here marks
      # the container unhealthy forever with "exec: curl: not found". The
      # stdlib urllib one-liner hits the unauthenticated liveliness probe and
      # exits 0 on HTTP 200, non-zero otherwise.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # LiteLLM can take ~60-90s to boot (Prisma migration check + worker
      # spin-up against Postgres); a 30s grace nearly flapped to unhealthy on
      # a real recreate. start_period only widens the startup tolerance — it
      # never delays healthy detection on a fast boot — so 60s is free safety.
      start_period: 60s

  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: litellm-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"          # allow container POST actions (SIGHUP reload) — used from Phase 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  llm-proxy-ui:
    build: ./ui
    container_name: litellm-ui
    restart: unless-stopped
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      CONFIG_PATH: /config/config.yaml
      SOCKET_PROXY_URL: http://socket-proxy:2375
      LITELLM_CONTAINER: litellm-proxy
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      HOUSEKEEPING_ENABLED: "${HOUSEKEEPING_ENABLED:-false}"
      HOUSEKEEPING_INTERVAL_HOURS: "${HOUSEKEEPING_INTERVAL_HOURS:-24}"
      HOUSEKEEPING_SPENDLOG_RETENTION_DAYS: "${HOUSEKEEPING_SPENDLOG_RETENTION_DAYS:-90}"
      HOUSEKEEPING_DELETE_EXPIRED_KEYS: "${HOUSEKEEPING_DELETE_EXPIRED_KEYS:-true}"
    volumes:
      - ./config:/config        # directory mount: enables atomic temp-file + rename
    ports:
      - "${UI_PORT:-8081}:8080"
    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
