services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: litellm-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - ./data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    ports:
      - "4000:4000"
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "true"
      # REDIS_HOST/REDIS_PORT intentionally unset. On current LiteLLM, ANY
      # LiteLLM<->Redis connection (response cache OR proxy config-sync) hits
      # the init_async_client loop-binding bug (BerriAI/litellm#19724): the
      # async client is cached across event loops, so every op hangs to
      # socket_timeout (5s) and floods logs with "Timeout connecting to server".
      # Response cache is in-memory (config.yaml cache_params type: local).
      # Valkey stays running and ready to re-wire once the upstream bug is fixed
      # or via a patched image (Option Y).
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # The official LiteLLM image is built on Chainguard Wolfi and ships NO
      # curl/wget — only python3 (it's a Python app). Using curl here marks
      # the container unhealthy forever with "exec: curl: not found". The
      # stdlib urllib one-liner hits the unauthenticated liveliness probe and
      # exits 0 on HTTP 200, non-zero otherwise.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # LiteLLM can take ~60-90s to boot (Prisma migration check + worker
      # spin-up against Postgres); a 30s grace nearly flapped to unhealthy on
      # a real recreate. start_period only widens the startup tolerance — it
      # never delays healthy detection on a fast boot — so 60s is free safety.
      start_period: 60s
