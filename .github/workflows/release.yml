name: release
on:
  push:
    branches: [main]
  # Manual self-heal: when semantic-release tagged a version but the image
  # build/push failed (e.g. a transient buildx "unknown blob"), re-run just the
  # build & push for that already-tagged release — WITHOUT re-publishing.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing release version to (re)build & push the UI image for, e.g. 1.31.0 (no leading v)."
        required: true
        type: string
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + all tags (needed to check out a release tag on manual re-run)
      - name: Semantic release
        id: semantic
        if: github.event_name == 'push'   # never re-publish on a manual image rebuild
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine build target
        id: meta
        env:
          # Pass all context values through env (never interpolate ${{ }} into the
          # shell body) so a crafted workflow_dispatch input can't inject commands.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          NEW_PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          NEW_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG#v}"                    # tolerate a leading 'v'
            if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "image_tag must be a semver like 1.31.0 (got: '$TAG')"; exit 1
            fi
            {                                        # build the tagged tree, so image == release
              echo "should_build=true"
              echo "version=$TAG"
              echo "checkout_ref=v$TAG"
            } >> "$GITHUB_OUTPUT"
          elif [ "$NEW_PUBLISHED" = "true" ]; then
            {
              echo "should_build=true"
              echo "version=$NEW_VERSION"
              echo "checkout_ref="
            } >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the release tag (manual rebuild only)
        if: ${{ steps.meta.outputs.should_build == 'true' && steps.meta.outputs.checkout_ref != '' }}
        env:
          CHECKOUT_REF: ${{ steps.meta.outputs.checkout_ref }}   # already a validated v<semver>
        run: git checkout "$CHECKOUT_REF" || { echo "tag $CHECKOUT_REF not found"; exit 1; }
      - name: Set up Buildx
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        uses: docker/setup-buildx-action@v3   # docker-container driver: more robust registry pushes than the default driver
      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push UI image (retry on transient registry errors)
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "::group::build-push attempt $attempt"
            if docker buildx build \
                --push \
                --build-arg APP_VERSION="${VERSION}" \
                --tag "ghcr.io/tekgnosis-net/llm-proxy-ui:${VERSION}" \
                --tag "ghcr.io/tekgnosis-net/llm-proxy-ui:latest" \
                ./ui; then
              echo "::endgroup::"
              echo "build-push succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            wait=$((attempt * 20))
            echo "attempt $attempt failed; retrying in ${wait}s (transient 'unknown blob' etc.)"
            sleep "$wait"
          done
          echo "build-push failed after 3 attempts"
          exit 1
