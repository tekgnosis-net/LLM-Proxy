general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  telemetry: false
  cache: true
  cache_params:
    # Configure the Redis cache HERE (or in the DB), NOT via the admin UI's
    # Cache Settings form: the UI writes an `ssl` key, which triggers LiteLLM
    # bug #10949 (RedisCache uses SSLConnection whenever an `ssl` key is
    # present, even ssl=False) -> TLS handshake against plain Valkey hangs ->
    # "Timeout connecting to server". Do NOT add an `ssl:` line here.
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

# model_list intentionally omitted.
# Add and manage models through the UI at http://localhost:4000/ui
# (they will be stored in Postgres because store_model_in_db: true).
