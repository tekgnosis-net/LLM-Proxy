general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  telemetry: false
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

# model_list intentionally omitted.
# Add and manage models through the UI at http://localhost:4000/ui
# (they will be stored in Postgres because store_model_in_db: true).
