general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  telemetry: false
  cache: true
  cache_params:
    # Configure the Redis cache HERE (or in the DB), NOT via the admin UI's
    # Cache Settings form: the UI writes an `ssl` key, which triggers LiteLLM
    # bug #10949 (RedisCache uses SSLConnection whenever an `ssl` key is
    # present, even ssl=False) -> TLS handshake against plain Valkey hangs ->
    # "Timeout connecting to server". Do NOT add an `ssl:` line here.
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

# NOTE: routing strategy is NOT set here. With store_model_in_db: true,
# LiteLLM reads router settings from the DB (LiteLLM_Config.router_settings),
# which OVERRIDES this file — a router_settings block here is silently ignored
# (verified). The admin UI Router Settings page is display-only in this build
# (GET /router/settings exists, but there is NO save endpoint), so the strategy
# can only be changed in the DB, e.g.:
#   UPDATE "LiteLLM_Config"
#     SET param_value = jsonb_set(param_value,'{routing_strategy}','"cost-based-routing"')
#     WHERE param_name='router_settings';
# Current value: cost-based-routing. See docs/cost-routing-guide.md.

# model_list intentionally omitted.
# Add and manage models through the UI at http://localhost:4000/ui
# (they will be stored in Postgres because store_model_in_db: true).
